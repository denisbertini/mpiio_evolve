# =============================================================================
# mpiio_evolve - Search Parameters & Cluster Declaration
# =============================================================================
# Everything in this file is consumed by evaluate.py. Values marked as a
# "search space" are boundaries for the LLM-in-the-loop evolutionary
# controller (OpenEvolve). Mutated candidates MUST stay inside these
# boundaries; out-of-bounds candidates are rejected before hitting Slurm.
#
# HARD RULE: no path in this system may resolve to '~' or a real $HOME.
# All scratch/cache/log locations are rooted at `workspace.root` (the
# parallel filesystem working directory, resolved at runtime).
# =============================================================================

workspace:
  # Deployment root on the parallel filesystem. On Virgo2 this is the RZ
  # project area on Lustre (there is NO /scratch here). Override per shell
  # with MPIIO_EVOLVE_ROOT or per call with --root (e.g. '--root .' for
  # offline development on a machine without /lustre).
  root: "/lustre/rz/dbertini2"

  # Every launcher invocation works inside its OWN state directory:
  #     <root>/<state_dir>/{runs, .fake_home, tmp, ...}
  # Pick one per user/controller instance so concurrent evolutions never
  # collide. Override: MPIIO_EVOLVE_STATE_DIR, --state-dir, or edit here.
  state_dir: "ppio_tune"

  runs_subdir: "runs"          # per-candidate run directories
  home_subdir: ".fake_home"    # synthetic $HOME exported into Slurm jobs
  keep_data: false             # delete benchmark data files after each run
  keep_runs: 200               # garbage-collect oldest run dirs beyond this
  # Real runs ABORT if no lfs binary exists: without it every stripe
  # mutation is a silent no-op and the fitness landscape is meaningless.
  # Set false only to deliberately tune MPI-IO hints on non-Lustre storage.
  # CONTAINER MODE: the controller SIF carries no lfs itself, but the Lustre
  # client lives in the HOST kernel (shared with the container) and
  # run_controller_sif.sh binds the host lfs + libs read-only when present
  # (proven: setstripe round-trip inside the confined container, lfs 2.15.8)
  # -> striping IS evolved from the container.  Hosts without lfs degrade to
  # hints-only; keep false there, else real runs refuse to start.
  lustre_strict: true

cluster:
  # ---- Slurm resource request (rendered into the #SBATCH header) ----------
  # Current target: ORION test pool on 'long' (ccdev[0012-0019]). NOT 'main':
  # main's nodelist ccdev[0001-0011] includes the LOGIN nodes ccdev0001/2,
  # and the evolution controller runs there -- a benchmark job scheduled
  # onto a login node would contend with (and eventually be starved by /
  # starve) the OpenEvolve process itself. 'long' is pure compute, idle,
  # 7-day limit, 96c/191G nodes (ccdev0012-19).
  partition: "long"
  account: "rz"          # TODO: your Slurm account/allocation
  qos: null                            # optional QoS
  nodes: 1
  tasks_per_node: 32
  cpus_per_task: 1
  mem_per_cpu: "2000M"                 # Orion main: MaxMemPerCPU=2000 (191G/96c).
                                       # 32 ranks x 2G = 64G -- EPOCH uses a
                                       # small fraction; also fine on Virgo4.
  time_limit: "00:25:00"               # damage cap: healthy 3-rep eval ~15 min
                                       # (10 fs reps ~4 min each on Orion); a
                                       # catastrophically slow candidate is
                                       # SIGKILLed at 25 min -> partial/zero
                                       # SDF bytes -> near-zero fitness ->
                                       # selection deletes that lineage.
                                       # Worst case per mutant: 25 min.
                                       # (adapter 3600 s / evaluator 4200 s
                                       # still exceed it -- Slurm stays the
                                       # authority on live jobs)
  # CPU-generation pinning. Orion's main is homogeneous gold6248r -> none
  # needed. For a Virgo4 campaign re-enable per-run (same checkout):
  #   MPIIO_EVOLVE_CONSTRAINT=9654   (its 'main' mixes EPYC 9654/9555/7713;
  #   letting candidates land on different CPU types would bias fitness)
  constraint: null
  extra_sbatch: []                     # raw extra '#SBATCH' lines, e.g. "--exclusive"
  # srun flags appended to the benchmark invocation, matching Denis's
  # validated run_file.sh: --mpi=pmix bootstraps MPI via PMIx (srun IS the
  # MPI launcher, no mpirun inside), --export=ALL propagates the job env
  # into every rank. The srun line is otherwise BARE: rank count comes
  # from the #SBATCH header, which every srun step inherits.
  extra_srun_args: "--mpi=pmix --export=ALL"
  wait: true                           # block sbatch with --wait

  # ---- MPI engine selection ------------------------------------------------
  # romio : MPICH / Intel MPI / Cray MPICH -> ROMIO text hint file (MPIIO_HINTS)
  # ompio : Open MPI 4.x OMPIO component  -> OMPI_MCA_* environment array
  # auto  : probe `mpiexec --version` in evaluate.py, fall back to default_engine
  mpi_engine: "auto"
  default_engine: "romio"

container:
  # All benchmark ranks run INSIDE the plasma-physics Apptainer image
  # (built by container/build_container.sh on the login node).
  enabled: true
  runtime: apptainer             # apptainer | singularity
  image: "images/current.sif"    # symlink refreshed by the build script
  # Extra `exec` options. NO --contain: with srun_direct (one container per
  # rank) it would give every rank a PRIVATE /dev/shm, killing Open MPI's
  # shared-memory intra-node transport (vader -> silent TCP fallback) and
  # diverging from the production invocations. Missing-$HOME isolation is
  # handled by the injected `--home <state>/.fake_home` (which also replaces
  # the passwd-home auto-bind --contain's only other useful effect), and
  # filesystem visibility by APPTAINER_BINDPATH in the job environment
  # (= the whole deploy root, site-validated).
  exec_opts: ""
  # srun_direct: Slurm launches one containerized rank per task via PMI(x).
  # Requires Slurm >= 23.02 with --mpi=pmix to match the image's PMIx 5.
  # Set cluster.extra_srun_args to "--mpi=pmix" accordingly.
  mpi_mode: "srun_direct"

benchmark:
  # Active profile -> fitness instrument for the NEXT campaign: pio-bench,
  # the purpose-built MPI-IO/HDF5/ADIOS2 checkpoint instrument (github:
  # denisbertini/pio-bench, tag-pinned inside the plasma image, ROMIO-info
  # pass-through since v0.2.1). Switch back to "epoch_io" any time; a
  # candidate may also override with {"benchmark_profile": "<name>"}.
  active: "pio_bench"
  # ntasks defaults to cluster.nodes * cluster.tasks_per_node. When set, it
  # is folded into the #SBATCH --ntasks-per-node header (must be divisible by
  # cluster.nodes), because the allocation -- not srun -- owns the rank count.
  # ntasks: 32

  profiles:
    epoch_io:
      # Checkpoint-stress EPOCH 3D LWFA run (benchmarks/epoch_io/
      # epoch3d_lwfa.deck): moving-window LWFA, tracer dumps every 1 fs +
      # field/particle dumps every 5 fs. The rank-aware wrapper measures
      # total SDF diagnostic volume / wall time and prints the generic line
      #   "aggregate write bandwidth: <x> GiB/s"
      # which parser.py scores. Tune the deck's dt_snapshot cadence to
      # mirror your production checkpoint cadence.
      command: "bash {repo}/benchmarks/epoch_io/run_bench.sh {data_dir}"
      # Pre-step run by the batch script ONCE per repetition BEFORE srun
      # (single writer): creates <data_dir>/rep<k>/ and symlinks the LWFA
      # deck to EPOCH's default name input.deck inside it. Ranks only cd
      # there and answer the "Specify output directory" prompt with '.'.
      setup_script: "bash {repo}/benchmarks/epoch_io/setup_run.sh {data_dir}"
      # Post-step run by the batch script once per repetition AFTER srun
      # returned (srun = barrier -> all ranks closed their files; no per-rank
      # coordination anywhere). Sums *.sdf bytes / wall time, layout-agnostic
      # (single shared collective-buffered file or per-rank SDFs).
      measure_script: "bash {repo}/benchmarks/epoch_io/measure.sh {data_dir}"

    pio_bench:
      # Purpose-built checkpoint instrument, pure MPI-IO backend: one
      # merged .bin per checkpoint (field hyperslabs + particle records),
      # exactly the ROMIO+Lustre path the candidates tune. The harness
      # injects the candidate as ROMIO_HINTS (env) + lfs setstripe (data
      # dir); pio-bench >= v0.2.1 passes an EMPTY MPI_Info so those hints
      # actually apply -- no per-candidate flags, no recompile, ever.
      # Workload (fixed, instrumented): 256^3 field + 4M particles/rank,
      # 3 checkpoints/rep -> ~12 GiB per checkpoint at 32 ranks.
      # SIZING RULE (Lustre): one checkpoint must exceed the client
      # dirty-page backpressure (~19 GB on 191 GB nodes at default
      # dirty_ratio) so sustained writes hit OST backpressure *inside*
      # the measured window; below it, "writes" are page-cache memcpy
      # and stripe mutations are unmeasurable. First checkpoint may
      # still read cache-inflated -> judge candidates on the rep mean.
      # Fitness feed: pio_metrics.jsonl (bytes/seconds per checkpoint);
      # --verify stays OFF in fitness runs (verification reads would
      # pollute the measured window; smoke.sh owns correctness).
      command: "bash {repo}/benchmarks/generic/run.sh {data_dir} pio_bench --backend mpiio --local 256 --particles 4000000 --steps 3 --interval 1"
      setup_script: "bash {repo}/benchmarks/generic/setup.sh {data_dir}"
      measure_script: "bash {repo}/benchmarks/generic/measure.sh --strategy jsonl {data_dir}"

    pio_bench_darshan:
      # FITNESS v2 variant (requires the image rebuilt WITH darshan 3.5.0):
      # same workload, wrapped rank-process is instrumented by Darshan, so
      # fitness can be scored on profiler-measured io_only bandwidth --
      # independent of what the app chooses to report, per-rank resolved,
      # and eventually with aggregator-topology/OST attribution from the
      # same logs. Emits BOTH rate lines; fitness.metric decides (auto =
      # io-only when present). Cross-check on first runs: Darshan
      # cumulative bytes ~ app bytes (layers may double-count MPI-IO vs
      # POSIX -- verify the ratio before trusting absolute v2 numbers).
      command: "bash {repo}/benchmarks/generic/run.sh {data_dir} -- darshan-runtime pio_bench --backend mpiio --local 256 --particles 4000000 --steps 3 --interval 1"
      setup_script: "bash {repo}/benchmarks/generic/setup.sh {data_dir}"
      measure_script: "bash {repo}/benchmarks/generic/measure.sh --strategy darshan {data_dir}"

# =============================================================================
# SEARCH SPACE - boundaries handed to the LLM mutation prompt
# =============================================================================
search_space:

  lustre:
    # `lfs setstripe -c <count> -S <size> <dir>` applied to the run data dir.
    stripe_count: [-1, 1, 2, 4, 8, 16, 32, 56, 112]   # -1=broadcast, 0=fs default
    stripe_size:  ["1M", "4M", "8M", "16M", "32M"]

  romio:
    # Keys land in the ROMIO text hints file (whitespace 'key value' pairs,
    # delivered via ROMIO_HINTS). Values here are HARD-VALIDATED before
    # submission (infrastructure.validate_hint_values).
    romio_cb_read:   ["automatic", "enable", "disable"]
    romio_cb_write:  ["automatic", "enable", "disable"]
    cb_nodes:        [1, 2, 4, 8, 16, 32]
    cb_buffer_size:  ["131072", "262144", "1M", "4M", "8M"]
    romio_ds_read:   ["automatic", "enable", "disable"]
    # 'disable' REMOVED from ds_write values: site-measured poison when
    # combined with collective buffering (aggregator read-modify-write
    # storms, hours-vs-minutes). The optimizer must never see it.
    romio_ds_write:  ["automatic", "enable"]
    no_io_anchors:   [null, true]
    # striping_count / striping_unit / direct_io kept OUT of the search on
    # purpose -- NOT because they are dead: verified 2026-10-08 that this
    # libmpi.so carries ROMIO's AD-IO-Lustre backend (romio_lustre_start_
    # iodevice + liblustreapi.so.1; plus the MCA fs:lustre component), so
    # these hints WOULD really move file layout.  But striping lives in
    # lustre.* (lfs setstripe) as the single actuator -- two independent
    # paths setting the same layout would confound every measurement.
    # Consequence of the live AD backend: ROMIO auto-detects the stripe
    # layout at MPI_File_open and sizes collective buffering to it; an
    # explicit cb_nodes OVERRIDES that auto-alignment -> the optimizer
    # explores matched (cb_nodes ~ stripe_count), mismatched, and
    # automatic regimes.

  ompio:
    # Keys become OMPI_MCA_io_ompio_<key> environment variables (Open MPI 4.x).
    num_aggregators:        [-1, 1, 2, 4, 8, 16, 32]    # -1 = auto-select (MCA default)
    bytes_per_agg:          ["1M", "4M", "16M", "64M"]  # == cb_buffer_size hint
    jobs_per_aggregator:    [1, "auto", 2, 4, 8]
    io_stripe_size:         ["1M", "4M", "8M", "16M"]
    fb_data_size:           ["64K", "256K", "1M", "4M"] # frontier-backing granule
    coll_opt:               [0, 1, 2, 4]                # collective optimization bitmask
    periodic_file_sync:     [0, 1]

  # Free-form escape hatch: the LLM may add env vars here, but ONLY keys
  # matching env_prefix_allowlist are exported; anything else is dropped.
  extra_env: {}
  # OMPI_MCA_fcoll: force an OMPIO collective-I/O algorithm component
  # (dynamic_gen2 | vulcan | static) -- an orthogonal, engine-native axis.
  env_prefix_allowlist: ["I_", "ROMIO_", "FI_", "UCX_", "LUSTRE_", "PMI_", "MPIIO_", "OMPI_MCA_fcoll"]

# =============================================================================
# FITNESS SHAPING
# =============================================================================
fitness:
  # ---- Metric source -------------------------------------------------------
  #   app     : score the rates the benchmark itself reports (v1)
  #   io_only : score Darshan's profiler-measured io-only bandwidth (v2;
  #             needs the pio_bench_darshan profile + image with darshan)
  #   auto    : io_only when the run produced Darshan values, else app.
  # Both series are ALWAYS recorded in the ledger (io_only_mean_mib_sec,
  # scored_metric, metric_version), so switching is auditable after the
  # fact -- never a silent fitness redefinition.
  metric: "app"
  # ---- Statistics: physics-style N-fold measurement --------------------------
  # One benchmark pass on a shared Lustre is an anecdote. Every candidate is
  # measured `repetitions` times; the score is computed on the ARITHMETIC MEAN
  # and mean +/- std (and SEM) are reported in the metrics. NEVER score on
  # max: on shared storage the maximum is contention luck, not signal.
  repetitions: 3
  repeat_mode: "in_job"     # in_job      -- N passes inside ONE allocation
                            #               (cheap; intra-run noise only; the
                            #               Slurm --time covers ALL reps)
                            # across_jobs -- N independent sbatch jobs, which
                            #               also samples queue/contention
                            #               drift: the honest estimator

  # Per-rep statistic fed from the log (IOR prints both lines per pass);
  # cross-repetition aggregation is ALWAYS the mean.
  prefer: "max"            # "max" | "mean"
  weights:
    write: 1.0
    read: 0.5
  # Multiplicative penalty when write throughput is unmeasured but read is
  # (partial crash): score *= partial_credit
  partial_credit: 0.25

  # ---- Drift normalization (optional but recommended for long runs) ----------
  # A fixed reference candidate is re-measured whenever its last measurement
  # is older than reference_max_age_min; its write mean then rides along in
  # every evaluation as metrics["reference_write_mean_mib_sec"], so candidates
  # from different generations can be compared against a contemporaneous
  # yardstick instead of raw drifting numbers. null disables.
  reference_candidate: null      # e.g. "examples/candidate_romio.json"
  reference_max_age_min: 60

logging:
  level: "INFO"
