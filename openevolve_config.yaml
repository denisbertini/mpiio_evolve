# =============================================================================
# openevolve_config.yaml -- evolutionary tuning of MPI-IO for EPOCH/Lustre
#
# Topology (GSI Virgo4 CPU cluster + Virgo2 GPU cluster for inference):
#   controller   : ccsub0001 login, tmux, Lustre venv (.controller_env)
#   evaluations  : Slurm 'main' partition (EPYC 9654, constraint-pinned for
#                  measurement homogeneity) via evaluate.py -> sbatch
#   LLM          : GPU-cluster llama.cpp behind the uvicorn proxy:
#                  http://ccdev0022.hpc.gsi.de:8781/v1   (NO_PROXY required!
#                  the Squid proxy on ccsub* eats un-bypassed HTTP)
#
# Launch:  ./tools/run_controller.sh openevolve_config.yaml
# =============================================================================

max_iterations: 40              # ~10-12 min/eval on idle Orion -> 40 gens
                               # comfortably overnight; stop any time
                               # (checkpointed population)
checkpoint_interval: 5
log_level: "INFO"
random_seed: 42

language: "json"                # the evolved "program" is a candidate config
file_suffix: ".json"            # temp candidate files parse as JSON downstream
diff_based_evolution: false     # small files: full regeneration is far more robust
max_code_length: 4000

llm:
  models:
    - name: "/tmp/Qwen_Qwen3.8-Flash-Next_UD-Q4_K_XL-00001-of-00004.gguf"
      weight: 1.0
  api_base: "http://ccdev0022.hpc.gsi.de:8781/v1"
  api_key: "unused"             # proxy ignores it; the client requires one
  temperature: 0.6              # creative but the JSON must stay valid
  top_p: 0.95
  max_tokens: 8192              # THINKING model: the reasoning burst counts
                                # against this cap.  2048 was always consumed
                                # by reasoning alone -> completion truncated
                                # at exactly max_tokens, 'No valid code found
                                # in response', every iteration scored 0.
  timeout: 300
  retries: 3
  retry_delay: 10

evaluator:
  timeout: 4200                 # POC: 3 reps ~20 min; > evaluation_io
                                # _EVAL_TIMEOUT_S (3600) so the client
                                # times out first
  max_retries: 1                # a failed eval scores 0; don't burn allocations
  cascade_evaluation: false     # every candidate gets the honest 3-rep measurement
  parallel_evaluations: 1       # serial first; raise to 2-3 once Lustre noise is known
  enable_artifacts: true

database:
  in_memory: true
  population_size: 30
  num_islands: 2
  archive_size: 10

prompt:
  num_top_programs: 3
  num_diverse_programs: 2
  system_message: |
    You are an expert in HPC I/O performance. You evolve MPI-IO configuration
    candidates (JSON) for the EPOCH particle-in-cell code writing SDF
    checkpoint dumps to Lustre on the GSI Virgo cluster (Open MPI 5.0.11,
    embedded ROMIO 3.4.1 via OMPI_MCA_io=romio341).

    A candidate JSON may contain: lustre.striping_count/stripe_size (lfs
    setstripe applied to the dump directory before the run), romio hints
    (romio_cb_write/romio_cb_read: collective buffering; cb_nodes: number of
    aggregator ranks; cb_buffer_size; romio_ds_read/romio_ds_write:
    data-sieving; no_io_anchors), an ompio section (used only when
    engine=ompio), engine ("romio" or "ompio"), and an optional
    benchmark_profile. Only values listed in the provided search space are
    legal. Switching engine to "ompio" replaces the whole tuning surface
    with OMPI_MCA_io_ompio_* variables.

    Fitness = aggregate SDF write bandwidth (GiB/s), measured as the MEAN of
    3 repetitions inside one allocation; SEM error bars appear in the
    feedback. Values outside the declared search space are REJECTED before
    submission (zero fitness + explanatory feedback); a run that exceeds the
    25-minute wall limit is killed and scores on its partial output -- so a
    catastrophically slow candidate costs the campaign at most one
    evaluation. Lustre is shared: differences smaller than the SEM are noise,
    do not chase them. Physical intuition that transfers: too many
    aggregators (cb_nodes) add RPC overhead, too few bottleneck the big
    collective stream; stripe_count should match what a single large
    collective file can spread across; collective buffering pairs well with
    stripe_size >= the per-aggregator chunk (cb_buffer_size); data-sieving
    hurts when per-rank strided extents are large and contiguous.

    Site-verified facts (do not re-derive): ROMIO on this stack reports
    filesystem_type=UFS (its Lustre auto-detection misses this client), so
    romio's own striping_* and direct_io hints are PARSED BUT INERT -- all
    Lustre striping must come through lustre.striping_count/stripe_size,
    which is applied with lfs setstripe and DOES work. The effective knobs
    are the cb_* family: factory defaults are romio_cb_write=automatic with
    cb_config_list *:1 / cb_nodes 1, i.e. collective buffering is
    essentially OFF -- turning it on and sizing cb_nodes/cb_buffer_size is
    the primary lever to explore. POISON COMBO (site-measured,
    catastrophic): romio_cb_write=enable together with
    romio_ds_write=disable forces aggregators into read-modify-write of
    partially-filled blocks -- never disable data sieving while collective
    buffering is on.

    Output ONLY the complete candidate JSON. No prose, no markdown fences.
